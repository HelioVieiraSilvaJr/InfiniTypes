version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    # Estas versões exigem compileSdk 37. Tirar daqui quando o projeto subir para o SDK 37.
    ignore:
      - dependency-name: androidx.compose:compose-bom
        versions: [">= 2026.09.00"]
      - dependency-name: androidx.core:core-ktx
        versions: [">= 1.19.0"]
