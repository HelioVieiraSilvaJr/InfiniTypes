name: InfinidimTypes

options:
  bundleIdPrefix: com.infinidim
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: D93D4Z3ZT7
    # Assinatura manual e estável: o macOS vincula as permissões (TCC) a ela
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.1

targets:
  InfinidimTypes:
    type: application
    platform: macOS
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    sources:
      - path: InfinidimTypes
        excludes:
          - Resources/AppIcon.icon
          - Resources/AppIcon.icon/**
      # Ícone do Icon Composer (Liquid Glass): entra como arquivo único, não como pasta
      - path: InfinidimTypes/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: InfinidimTypes/Resources/Info.plist
      properties:
        CFBundleDisplayName: InfinidimTypes
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMicrophoneUsageDescription: O InfinidimTypes grava sua voz apenas enquanto você segura o atalho de ditado, para transformá-la em texto.
    entitlements:
      path: InfinidimTypes/Resources/InfinidimTypes.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: InfinidimTypes
        PRODUCT_BUNDLE_IDENTIFIER: com.infinidim.InfinidimTypes
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    scheme:
      testTargets:
        - InfinidimTypesTests

  InfinidimTypesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InfinidimTypesTests
    dependencies:
      - target: InfinidimTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infinidim.InfinidimTypesTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
