name: InfiniTypes

options:
  bundleIdPrefix: com.infinidim
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Assinatura em Config/Signing.xcconfig: ad hoc por padrão, ou o seu time em Config/Signing.local.xcconfig
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1

targets:
  InfiniTypes:
    type: application
    platform: macOS
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    sources:
      - path: InfiniTypes
        excludes:
          - Resources/AppIcon.icon
          - Resources/AppIcon.icon/**
      # Prompts do refinamento, compartilhados com as outras plataformas
      - path: ../shared/prompts
        buildPhase: resources
      # Ícone do Icon Composer (Liquid Glass): entra como arquivo único, não como pasta
      - path: InfiniTypes/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: InfiniTypes/Resources/Info.plist
      properties:
        CFBundleDisplayName: InfiniTypes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMicrophoneUsageDescription: O InfiniTypes grava sua voz apenas enquanto você segura o atalho de ditado, para transformá-la em texto.
    entitlements:
      path: InfiniTypes/Resources/InfiniTypes.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: InfiniTypes
        PRODUCT_BUNDLE_IDENTIFIER: com.infinidim.InfiniTypes
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        # O certificado de desenvolvimento injetaria get-task-allow (depurador) também no Release.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - InfiniTypesTests

  InfiniTypesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InfiniTypesTests
      # Casos de conformidade, os mesmos dos testes das outras plataformas
      - path: ../shared/conformance
        type: folder
        buildPhase: resources
    dependencies:
      - target: InfiniTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infinidim.InfiniTypesTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
